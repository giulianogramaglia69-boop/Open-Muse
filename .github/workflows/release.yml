# Release
#
# Builds Open-Muse installers for Linux, Windows and macOS and attaches
# them to a GitHub release. Triggered by pushing a tag like `v0.1.0`,
# or manually from the Actions tab (workflow_dispatch).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: Open-Muse-v__VERSION__
          releaseName: "Open-Muse v__VERSION__"
          releaseBody: "See the assets below to download and install Open-Muse."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-muse-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: warn
